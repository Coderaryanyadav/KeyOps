[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-security-center"
version = "1.0.0"
description = "Authorized personal cybersecurity macOS application for password analysis and human-in-the-loop security rotation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Security Architect", email = "security@example.com"}
]
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "keyring>=24.0.0",
    "tldextract>=5.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
password-security = "app.cli.commands:app"

[tool.setuptools.packages.find]
where = ["."]
